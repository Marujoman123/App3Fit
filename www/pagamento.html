<!DOCTYPE html>
<script src="js/global.js"></script>
<html>

<head>
    <meta charset="utf-8">
    <!--
        Customize this policy to fit your own app's needs. For more guidance, please refer to the docs:
            https://cordova.apache.org/docs/en/latest/
        Some notes:
            * https://ssl.gstatic.com is required only on Android and is needed for TalkBack to function properly
            * Disables use of inline scripts in order to mitigate risk of XSS vulnerabilities. To change this:
                * Enable inline JS: add 'unsafe-inline' to default-src
        -->
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' data: https://ssl.gstatic.com 'unsafe-eval'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: content:;">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/style.css">

    <title>3Fit - Pagamento</title>
</head>


<body>

    <div class="login-container-internal">

        <div id="user-header" class="user-header">
            <h2 id="tituloCaixa" style="margin-right: auto;">Resumo da Compra</h2>

            <div class="user-info-container">

                <button id="btnRelatorio" style="flex: 1; text-align: left; display: none;">Relatório</button>
                <div class="user-details">

                    <span id="header-nome">Carregando...</span>
                    <span id="header-saldo" class="saldo-badge" style="display: none;">Saldo: R$ 0.00</span>
                </div>
                <div class="user-icon">
                    <img src="img/user-icon.png" alt="Usuário">
                </div>
                <div class="sair">
                    <button id="btnSair" style="padding: 0px; background-color: black;">
                        <img src="img/arrow-right-from-bracket-solid-full.svg" alt="Sair"></button>
                </div>
            </div>

        </div>



        <div class="login-container">
            <div class="login-container-internal">

                <div class="input-group" id="containerCupom">
                    <label style="color: #000;">Possui Cupom de Parceiro?</label>

                    <div style="display: flex; gap: 5px;">
                        <input type="text" id="inputCupom" placeholder="Digite o cupom">
                        <button id="btnValidarCupom" style="width: auto; height: 100%;">Validar</button>
                    </div>

                    <label id="msgCupom" style="font-size: 0.8rem; margin-top: 5px; display: block;"></label>
                </div>

                <div id="containerSaldo"
                    style="display: none; margin-top: 15px; border: 1px dashed #ccc; padding: 10px;">
                    <label style="color: #000;">Gostaria de pagar com saldo?</label>
                    <label>Saldo Disponível: <b>R$ <span id="txtSaldoDisponivel">0.00</span></b></label>
                    <div style="display: flex; gap: 5px; margin-top: 5px;">
                        <input type="number" id="inputUsarSaldo" step="0.01" inputmode="decimal" placeholder="0.00">
                        <!-- <button id="btnAplicarSaldo" style="width: auto;">Aplicar</button> -->
                    </div>
                    <label id="msgSaldo" style="font-size: 0.8rem; display: block;"></label>
                </div>

                <div id="listaItensPagamento"
                    style="margin-bottom: 10px; text-align: left; border-bottom: 1px solid #ddd;">
                    <h3 style="font-size: 1rem; color: #000;">Itens selecionados:</h3>
                </div>








            </div>




            <div class="login-container-internal">
                <div class="resumo-simples">
                    <p id="dtot">Total dos Itens: <b>R$ <span id="totalOriginal">0.00</span></b></p>
                        <p id="txtCumpom"> </p>
                        <p id="valorDesconto" style="color: green; display: none;"> </p>
                        <p id="txtSaldoUsado" style="color: green; display: none;"> </p>
                 
                    <hr id="linhatot">
                    <p>Total a Pagar: R$ <span id="totalFinal">0.00</span></p>
                </div>





                <button id="btnFecharModal" class="btn-secundario">Cancelar</button>
                <button id="btnConfirmarPagamento" onclick="dispararPagamentoNaMaquina()" style="background-color: #28a745; margin-top: 20px;">Confirmar e
                    Finalizar</button>
            </div>


        </div>

    </div>

    <div id="modalPagamento" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <h2>Selecione a Forma de Pagamento</h2>
        <div class="grid-pagamentos">
            <button class="btn-pagamento" onclick="selecionarPagamento('CREDITO')">
                <i class="fas fa-credit-card"></i> Crédito
            </button>
            <button class="btn-pagamento" onclick="selecionarPagamento('DEBITO')">
                <i class="fas fa-money-check"></i> Débito
            </button>
            <button class="btn-pagamento" onclick="selecionarPagamento('PIX')">
                <i class="fas fa-qrcode"></i> Pix
            </button>
            <button class="btn-pagamento" onclick="selecionarPagamento('VOUCHER')">
                <i class="fas fa-ticket-alt"></i> Voucher (Ticket)
            </button>
        </div>
        <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
    </div>
</div>




</body>

</html>
<script src="js/auth.js"></script>
<script src="js/pagamento.js"></script>
