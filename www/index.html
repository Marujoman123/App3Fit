<!DOCTYPE html>
<script src="js/global.js"></script>
<html>

<head>
    <meta charset="utf-8">
    <!--
        Customize this policy to fit your own app's needs. For more guidance, please refer to the docs:
            https://cordova.apache.org/docs/en/latest/
        Some notes:
            * https://ssl.gstatic.com is required only on Android and is needed for TalkBack to function properly
            * Disables use of inline scripts in order to mitigate risk of XSS vulnerabilities. To change this:
                * Enable inline JS: add 'unsafe-inline' to default-src
        -->
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' data: https://ssl.gstatic.com 'unsafe-eval'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: content:;">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/style.css">

    <title>3Fit</title>
    <link rel="icon" type="image/png" href="img/3fitLogo.svg">
</head>

<body>




    <div id="loginContainer" class="login-container" style="margin-top: 20px;">


        <div class="login-container-internal">
            <h1>Bem-vindo</h1>
            <p>Digite seu CPF para acessar o sistema</p>
        </div>

        <div class="login-container-internal">
            <div class="input-group">
                <input type="text" id="cpf" placeholder="000.000.000-00" inputmode="numeric" maxlength="14"
                    autocomplete="off">
            </div>
            <p id="mensagem-erro" class="error"></p>

            <button id="btnEntrar">Entrar</button>
        </div>

    </div>



    <div id="loadingLogin" class="loading-container" style="display: none;">
        <div class="spinner"></div>
        <p>Verificando cadastro...</p>
    </div>


    <div id="modalSenha" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:9999; justify-content:center; align-items:center;">
    <div style="background:white; padding:20px; border-radius:10px; text-align:center; width:80%; max-width:300px;">
        <h3>Senha Administrativa</h3>
        <input type="password" id="inputSenhaAdmin" inputmode="numeric" pattern="[0-9]*" 
               style="width:100%; padding:15px; font-size:20px; text-align:center; margin:15px 0; border:1px solid #ccc;">
        <div style="display:flex; gap:10px;">
            <button id="btnCancelarSenha" style="flex:1; padding:10px; background:#ccc; border:none; border-radius:5px;">Cancelar</button>
            <button id="btnConfirmarSenha" style="flex:1; padding:10px; background:#007bff; color:white; border:none; border-radius:5px;">Entrar</button>
        </div>
    </div>
</div>




</body>

</html>

<script src="js/index.js"></script>
