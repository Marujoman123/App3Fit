<!DOCTYPE html>
<html class="quiosque">

<head>
    <meta charset="utf-8">
    <!--
        Customize this policy to fit your own app's needs. For more guidance, please refer to the docs:
            https://cordova.apache.org/docs/en/latest/
        Some notes:
            * https://ssl.gstatic.com is required only on Android and is needed for TalkBack to function properly
            * Disables use of inline scripts in order to mitigate risk of XSS vulnerabilities. To change this:
                * Enable inline JS: add 'unsafe-inline' to default-src
        -->
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' data: https://ssl.gstatic.com 'unsafe-eval'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: content:;">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/wifi-quiosque.css">

    <title>3Fit</title>
    <link rel="icon" type="image/png" href="img/3fitLogo.svg">
</head>

<body>




    <div id="loginContainer" class="login-container" style="margin-top: 20px;">


        <div class="login-container-internal">
            <h1>Bem-vindo</h1>
            <p>Digite seu CPF para acessar o sistema</p>
        </div>

        <div class="login-container-internal">
            <div class="input-group">
                <input type="text" id="cpf" placeholder="000.000.000-00" inputmode="numeric" maxlength="14"
                    autocomplete="off">
            </div>
            <p id="mensagem-erro" class="error"></p>

            <button id="btnEntrar">Entrar</button>

            <!-- Quiosque: aparece só sem internet (js/wifi-quiosque.js) -->
            <div id="areaWifi" class="wifi-oculto">
                <p class="wifi-aviso">Sem conexão com a internet</p>
                <button type="button" id="btnConfigurarWifi" class="btn-wifi">Configurar Wi-Fi</button>
            </div>
        </div>

    </div>



    <div id="loadingLogin" class="loading-container" style="display: none;">
        <div class="spinner"></div>
        <p>Verificando cadastro...</p>
    </div>


    <div id="modalSenha" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:9999; justify-content:center; align-items:center;">
    <div class="senha-caixa">
        <h3>Senha Administrativa</h3>
        <input type="password" id="inputSenhaAdmin" inputmode="numeric" pattern="[0-9]*" class="senha-input">
        <div class="senha-botoes">
            <button id="btnCancelarSenha" class="senha-cancelar">Cancelar</button>
            <button id="btnConfirmarSenha" class="senha-confirmar">Entrar</button>
        </div>
    </div>
</div>




</body>

</html>

<!-- cordova.js: necessário para o botão de Wi-Fi do quiosque (plugin cordova-plugin-kiosk) -->
<script src="cordova.js"></script>
<script type="module" src="js/index.js"></script>
<script type="module" src="js/wifi-quiosque.js"></script>
