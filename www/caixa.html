<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
    <link rel="stylesheet" href="css/caixa.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Caixa Autônomo</title>
</head>

<body>

    <div id="loading" class="loading-container">
        <div class="spinner"></div>
        <p>Sincronizando produtos...</p>
    </div>

    <div class="login-container-internal" id="conteudoCaixa" style="display: none;">

        <div id="user-header" class="user-header">
            <h2 id="tituloCaixa" style="margin-right: auto;">Caixa</h2>
            <div class="user-info-container">

                <div class="user-details">

                    <span id="header-nome">Carregando...</span>
                    <span id="header-saldo" class="saldo-badge" style="display: none;">Saldo: R$ 0.00</span>
                </div>
                <div class="user-icon">
                    <img src="img/user-icon.png" alt="Usuário">
                </div>
            </div>
        </div>

        <div class="login-container-sem-margem">

            <div class="login-container-internal">
                <div id="listaProdutos" class="lista-itens"> </div>
                <h3> Total: R$ <span id="valorTotal">0.00</span></h3>
            </div>

            <div class="login-container-internal">
                <div class="input-group">
                    <label>Produto:</label>
                    <form id="formBarcode">
                        <input type="number" id="barcodeInput" placeholder="Escaneie ou digite..." inputmode="numeric"
                            enterkeyhint="done" autofocus>
                    </form>
                </div>
                <button id="btnContinuar">Continuar para Pagamento</button>
            </div>
        </div>
    </div>

</body>

</html>
<script src="js/auth.js"></script>
<script src="js/caixa.js"></script>
