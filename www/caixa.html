<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
    <link rel="stylesheet" href="css/caixa.css">
    <link rel="stylesheet" href="css/style.css">
    <title>3Fit - Caixa</title>
</head>

<body>

    <div id="loading" class="loading-container">
        <div class="spinner"></div>
        <p>Sincronizando produtos...</p>
    </div>

    <div class="login-container-internal" id="conteudoCaixa" style="display: none;">

        <div id="user-header" class="user-header">
            <h2 id="tituloCaixa" style="margin-right: auto;">Caixa</h2>

           

            <div class="user-info-container">

                <button id="btnRelatorio" style="flex: 1; text-align: left; display: none;">Relatório</button>
                <div class="user-details">

                    <span id="header-nome">Carregando...</span>
                    <span id="header-saldo" class="saldo-badge" style="display: none;">Saldo: R$ 0.00</span>
                </div>
                <div class="user-icon">
                    <img src="img/user-icon.png" alt="Usuário">
                </div>
                <div class="sair">
                    <button id="btnSair" style="padding: 0px; background-color: black;">
                        <img src="img/arrow-right-from-bracket-solid-full.svg" alt="Sair"></button>
                </div>
            </div>

        </div>

        <div class="login-container-sem-margem">

            <div class="login-container-internal">
                <div class="linha-carrinho lista-header">
                    <span class="header-produto">Produto</span>
                    <span class="header-qtd">Qtd</span>
                    <span class="header-preco">Preço</span>
                    <span class="header-vazio"></span>
                </div>

                <div id="listaProdutos" class="lista-itens"> </div>

                <div class="total-fundo">
                    <h3 style="margin: 0%; padding: 0%;"> Total: R$ <span id="valorTotal">0.00</span></h3>
                </div>
            </div>
        </div>


        <div id="modalFooter" class="modal-bottom-sheet">
            
            <div class="login-container-internal">
                <div class="input-group">

                    <form id="formBarcode" style="margin: 0%; padding: 0%; ">
                        <div id="scanner-container"
                            style="text-align: center;  border: 2px dashed #007bff; border-radius: 15px; background: #ffffff; margin: 0%; padding: 0%;">
                            <img src="img/barcode-scan.gif" alt="Aguardando Leitura"
                                style="width: 150px; opacity: 1; margin: 0%; padding: 0%;">
                                 <input type="text" id="barcodeInput"
                style="opacity: 0; pointer-events: none; height: 0.5px; border: 0px; padding: 0px;">


                            <p style="color: #000000; margin: 0%; padding: 1%;">Passe o produto no leitor de código de
                                barras</p>
                    </form>

                </div>
                <div class="login-container-sem-Fundo ">

                    <button id="btnFecharModal" class="btn-secundario">Cancelar</button>
                    <button id="btnContinuar" >Continuar para Pagamento</button>
                </div>

            </div>
        </div>
    </div>


</body>

</html>
<script src="js/auth.js"></script>
<script src="js/caixa.js"></script>
