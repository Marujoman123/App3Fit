<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Pedido - Admin</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .container-pedido {
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .bloco {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .item-selecao {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        .item-selecao:hover {
            background: #f0f0f0;
        }

        .badge-estoque {
            background: #eee;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.8rem;
        }

        .tipo-cliente {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            background: #eee;
            /* Fundo cinza para parecer uma barra única */
            padding: 5px;
            border-radius: 8px;
        }

        .btn-tipo {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: #666;
            background: transparent;
            transition: all 0.3s ease;
        }

        /* Estilo do Botão Selecionado */
        .btn-tipo.active {
            background: white;
            color: #007bff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>

    <div class="container-pedido">


        <div class="bloco">

            <div class="header-admin">
                <button onclick="location.href='admin.html'">← Voltar</button>
                <h1>Criar Novo Pedido</h1>
            </div>

            <h3>1. Escolha o Cliente</h3>
            <div class="tipo-cliente">
                <button class="btn-tipo active" id="btnCli" onclick="setTipo('Cliente')">Cliente Comum</button>
                <button class="btn-tipo" id="btnPar" onclick="setTipo('Parceiro')">Parceiro</button>
            </div>
            <input type="text" id="nomePedido" placeholder="Nome do Cliente/Destinatário"
                style="width:100%; padding:10px; margin-bottom:15px;">

            <h3>2. Selecione os Produtos</h3>
            <div id="listaSelecaoManual">
            </div>
        </div>

        <div class="bloco">
            <h3>Resumo do Pedido</h3>
            <div id="resumoPedido" style="min-height: 300px;">
            </div>
            <hr>
            <h2 id="totalPedido">Total: R$ 0.00</h2>
            <button onclick="limparPedidoCompleto()"
                style="background:#666; color:white; border:none; padding:10px; border-radius:5px; margin-bottom:10px; width:100%;">
                Limpar Todo o Pedido
            </button>
            <button onclick="gerarPDFPedido()"
                style="width:100%; padding:15px; background: #28a745; color:white; border:none; border-radius:5px; font-weight:bold;">
                EXPORTAR PDF / FINALIZAR
            </button>
        </div>S
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="js/admin-pedidos.js"></script>
</body>

</html>
