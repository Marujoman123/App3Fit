<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de Terminais Mercado Pago</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .terminal-card { 
            border: 1px solid #ddd; 
            padding: 10px; 
            margin: 10px 0; 
            border-radius: 5px;
        }
        button { padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Meus Terminais Mercado Pago</h2>
    <button id="btnListar">Listar Máquinas</button>
    <div id="resultado"></div>

    <script>
        document.getElementById('btnListar').addEventListener('click', listarTerminais);

        async function listarTerminais() {
            const resultadoDiv = document.getElementById('resultado');
            resultadoDiv.innerHTML = "Carregando...";

            // Configurações da API
            const url = 'https://api.http://localhost:3000/maquininhacartao';
            const token = 'APP_USR-3577250795393962-011007-1f142324435256c80ac8559f4743683f-3117694591'
            try {
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`Erro na requisição: ${response.status}`);
                }

                const data = await response.json();
                exibirTerminais(data.results);

            } catch (error) {
                resultadoDiv.innerHTML = `<p style="color:red">Erro: ${error.message}</p>`;
                console.error('Erro detalhado:', error);
            }
        }

        function exibirTerminais(terminais) {
            const resultadoDiv = document.getElementById('resultado');
            resultadoDiv.innerHTML = ""; // Limpa o carregando

            if (!terminais || terminais.length === 0) {
                resultadoDiv.innerHTML = "Nenhum terminal encontrado.";
                return;
            }

            terminais.forEach(terminal => {
                const div = document.createElement('div');
                div.className = 'terminal-card';
                div.innerHTML = `
                    <strong>ID do Terminal:</strong> ${terminal.id} <br>
                    <strong>Modelo:</strong> ${terminal.device_model || 'N/A'} <br>
                    <strong>Status:</strong> ${terminal.status}
                `;
                resultadoDiv.appendChild(div);
            });
        }
    </script>
</body>
</html>
