<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/style.css">
    <title>3Fit - Cadastro</title>
</head>

<body>


    <div class="login-container-internal">

        <h2>Cadastro</h2>
        <div class="login-container">
            <div class="login-container-internal">
                <p>Complete seus dados para acessar</p>

                <div class="input-group">
                    <input type="text" id="cadCpf" placeholder="000.000.000-00" inputmode="numeric" maxlength="14"
                        autocomplete="off">
                    <input type="text" id="cadNome" placeholder="Nome Completo"
                        oninput="this.value = this.value.toUpperCase()">
                    <input type="tel" id="cadTelefone" placeholder="(00) 00000-0000" inputmode="numeric" maxlength="15"
                        autocomplete="off">
                </div>
            </div>
 
            <div class="login-container-internal" style="display: flex;  justify-content: center; ">
                <button onclick="window.location.href='index.html'" class="btn-secundario">Voltar</button>
                <button id="btnSalvar">Finalizar Cadastro</button>
                
            </div>
        </div>
        
    </div>

</body>

</html>
<script src="js/cadastro.js"></script>
